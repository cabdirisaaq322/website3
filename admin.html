<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css?v=lg1"></head>
<body class="antialiased"><div class="lg-bg"><div class="lg-blob lg-b1"></div><div class="lg-blob lg-b2"></div><div class="lg-grain"></div></div>
<div id="root" class="wrap"><header class="liquid" data-lg="bar"><div class="wrap topbar-in"><a class="logo" href="/">⬇ Download<span>Hub</span> Admin</a><nav><a href="/">Store</a></nav></div></header>
<div class="wrap">
<div class="panel liquid" data-lg="bar" style="margin-top:16px"><div class="glass-content"><h3>🔑 Admin key</h3><div style="display:flex;gap:8px"><input id="key" placeholder="Enter ADMIN_KEY" style="max-width:260px"><button class="primary" onclick="login()" style="max-width:140px">Connect</button><span id="stat"></span></div></div></div>
<div class="admin-grid">
<div class="panel liquid" data-lg="hero"><div class="glass-content"><h3>⬆ Publish App</h3>
<form id="f"><input name="name" placeholder="App name *" required><input name="developer" placeholder="Developer"><select name="category"><option value="action">Action</option><option value="social">Social</option><option value="tools" selected>Tools</option><option value="music">Music</option><option value="video">Video</option><option value="photography">Photography</option><option value="productivity">Productivity</option><option value="lifestyle">Lifestyle</option></select><input name="version" value="1.0.0"><input name="os" value="Android 8.0+"><input name="downloads" type="number" placeholder="Initial downloads"><label>APK file<input type="file" name="apk"></label><label>Icon<input type="file" name="icon" accept="image/*"></label><label>Screenshots<input type="file" name="screenshots" multiple accept="image/*"></label><textarea name="description" placeholder="Description"></textarea><textarea name="changelog" placeholder="Changelog"></textarea><input name="tags" placeholder="tags, comma"><br><button class="primary" type="submit">Publish</button></form><div id="msg"></div></div></div>
<div class="panel liquid" data-lg="hero"><div class="glass-content"><h3>🖼 Hero Slider (3 slides)</h3><div id="heroList"></div><hr><h4>Settings</h4><input id="siteName" placeholder="Site name"><input id="newKey" placeholder="New key"><button class="primary" onclick="saveSet()">Save</button></div></div>
<div class="panel liquid" data-lg="hero"><div class="glass-content"><h3>📦 Apps <span id="ov"></span></h3><div id="list"></div></div></div>
</div></div></div>
<script src="/admin.js?v=lg1" defer></script><script src="/liquid.js?v=lg1" defer></script></body></html>
