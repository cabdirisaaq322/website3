services:
  - type: web
    name: downloadhub
    runtime: docker
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: PORT
        value: 3000
      # --- Cloudflare R2 (free 10GB, files survive restarts) ---
      # Fill these in Render dashboard after creating R2 bucket:
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
